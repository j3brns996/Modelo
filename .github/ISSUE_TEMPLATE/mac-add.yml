name: "Add a catalogue record"
description: "Propose one new governed catalogue record."
title: "Add: "
body:
  - type: markdown
    attributes:
      value: |
        ## Add something new

        Use this when the model, offering, evidence, vendor, service or condition does not already exist.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: dropdown
    id: request_type
    attributes:
      label: "Request type"
      description: "Fixed by this form."
      options:
        - "add"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: subject_kind
    attributes:
      label: "Subject type"
      description: "What governed record is changing?"
      options:
        - "model"
        - "offering"
        - "evidence"
        - "vendor"
        - "inference-service"
        - "condition"
    validations:
      required: true
  - type: input
    id: subject_identity
    attributes:
      label: "Subject identity"
      description: "Use the stable lowercase Modelo identity, not a display name or mutable provider alias."
      placeholder: "example-model-v1"
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one short sentence, what business or governance need does this request serve?"
      placeholder: "Example: Register a governed vendor before its models or offerings are proposed"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe the catalogue state that should be true when this work is complete."
      placeholder: "Example: Create the vendor record acme-ai; leave model and offering approval unchanged."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Give the reviewer the decision context. Explain why the current catalogue state is insufficient."
      placeholder: "Example: The vendor must exist as a governed identity before related records can reference it."
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "Optional. One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. These are candidate sources, not approval."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One observable completion check per line. State what a reviewer or CI can verify."
      placeholder: |
        The new record has the requested stable identity at its canonical path.
        The record and referenced evidence pass Modelo validation.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
