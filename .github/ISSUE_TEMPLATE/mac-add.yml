name: "Request: add a model or offering"
description: "Ask to add a new governed record to the catalogue."
title: "Add to catalogue: "
body:
  - type: markdown
    attributes:
      value: |
        ## Add something new

        Use this when the model or offering does not already exist in Modelo.

        **Before you start:** Gather the supporting source material first. A provider listing shows that something exists; it does not mean the enterprise has approved it.

        **What happens next:** the submitted JSON is validated against Modelo's change contract. A reviewed pull request and successful exact-head CI are still required before anything can be approved.
  - type: textarea
    id: mac_payload
    attributes:
      label: Change details (JSON)
      description: The operation must be `add`. Include the new record identity, the outcome you want, why it is needed, supporting observations and clear acceptance checks.
      render: json
      placeholder: |
        { "schema_version": "0.1", "operation": "add", "replace": "with a complete schema-valid payload" }
    validations:
      required: true
  - type: input
    id: payload_digest
    attributes:
      label: Change fingerprint
      description: Paste the generated SHA-256 fingerprint for the complete canonical JSON above.
      placeholder: sha256-...
    validations:
      required: true
  - type: checkboxes
    id: assertions
    attributes:
      label: Final checks
      options:
        - label: I checked that the model or offering is not already in the catalogue.
          required: true
        - label: I have not included credentials, tokens or private commercial terms.
          required: true
