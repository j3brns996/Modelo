name: "MAC: batch"
description: Propose at most 25 homogeneous items from one bounded observation scope.
title: "MAC batch: "
body:
  - type: markdown
    attributes:
      value: |
        Paste a complete `schemas/mac.schema.json` payload. A batch has one item operation, source, observation scope, inference service and purpose.
  - type: textarea
    id: mac_payload
    attributes:
      label: Neutral MAC payload
      description: The operation must be `batch`; generate both hashes from the canonical payload.
      render: json
      placeholder: |
        { "schema_version": "0.1", "operation": "batch", "replace": "with a complete schema-valid payload" }
    validations:
      required: true
  - type: input
    id: payload_digest
    attributes:
      label: Neutral payload digest
      description: SHA-256 of the complete canonical payload, including its two validated keys.
      placeholder: sha256-...
    validations:
      required: true
  - type: checkboxes
    id: assertions
    attributes:
      label: Assertions
      options:
        - label: The batch is homogeneous and contains no more than 25 subjects.
          required: true
        - label: I have not included credentials, tokens or private commercial terms.
          required: true
