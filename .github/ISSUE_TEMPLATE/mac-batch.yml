name: "Submit a related batch"
description: "Propose up to 25 changes from one source and observation scope."
title: "Batch: "
body:
  - type: markdown
    attributes:
      value: |
        ## Submit several related changes

        Use this only when every subject has the same operation, evidence source, observation scope and inference service.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: dropdown
    id: request_type
    attributes:
      label: "Modelo MAC request type"
      description: "Fixed by this form."
      options:
        - "batch"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: item_operation
    attributes:
      label: "Batch change type"
      description: "Every subject in this batch will use this operation."
      options:
        - "add"
        - "change"
        - "revoke"
    validations:
      required: true
  - type: dropdown
    id: subject_kind
    attributes:
      label: "Subject type"
      description: "Every subject in this batch must have this type. Revoke batches support offerings only."
      options:
        - "model"
        - "offering"
        - "evidence"
        - "vendor"
        - "inference-service"
        - "condition"
    validations:
      required: true
  - type: textarea
    id: subject_identities
    attributes:
      label: "Subject identities"
      description: "One stable lowercase Modelo identity per line; maximum 25."
      placeholder: |
        bedrock-model-a
        bedrock-model-b
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one short sentence, what business or governance need does this request serve?"
      placeholder: "Example: Apply one bounded provider observation to a related set of offerings"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe the catalogue state that should be true when this work is complete."
      placeholder: "Example: Apply the selected operation to every listed subject; make no other catalogue changes."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Give the reviewer the decision context. Explain why the current catalogue state is insufficient."
      placeholder: "Example: The subjects share one authoritative source, observation scope and inference service, so one reviewable batch is appropriate."
    validations:
      required: true
  - type: dropdown
    id: source_type
    attributes:
      label: "Evidence source type"
      description: "How was the bounded observation obtained?"
      options:
        - "first-party-read-api"
        - "official-documentation"
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: "Evidence source URL"
      description: "Official HTTPS source for the batch observation."
      placeholder: "https://bedrock.us-east-1.amazonaws.com/foundation-models"
    validations:
      required: true
  - type: input
    id: scope_ref
    attributes:
      label: "Opaque scope reference"
      description: "A non-secret internal scope label. Never enter an account ID."
      placeholder: "production-scope"
    validations:
      required: true
  - type: dropdown
    id: partition
    attributes:
      label: "Provider partition"
      description: "Provider partition for the observation scope."
      options:
        - "aws"
        - "aws-cn"
        - "aws-us-gov"
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: "Source region"
      description: "Region in which the read observation was made."
      placeholder: "us-east-1"
    validations:
      required: true
  - type: input
    id: inference_service
    attributes:
      label: "Inference service"
      description: "Stable governed service identity."
      placeholder: "aws-bedrock"
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "Optional. One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. These are candidate sources, not approval."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One observable completion check per line. State what a reviewer or CI can verify."
      placeholder: |
        Every listed subject has the selected operation and no subject outside the list changes.
        Every item uses the declared source, scope and inference service and passes Modelo validation.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
