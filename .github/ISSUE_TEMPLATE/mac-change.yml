name: "Update a catalogue record"
description: "Change facts while keeping the same stable identity."
title: "Update: "
body:
  - type: markdown
    attributes:
      value: |
        ## Update an existing record

        Use this when governed facts have changed but the logical identity remains the same. If the offering identity changes, use Move.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: input
    id: request_type
    attributes:
      label: "Modelo MAC request type"
      description: "Choose what should happen. Nothing is submitted until you review the native issue form. Allowed values: `change`."
      value: "change"
    validations:
      required: true
  - type: input
    id: subject_kind
    attributes:
      label: "Subject type"
      description: "A model describes capabilities. An offering records approved access. Evidence supports facts; conditions describe rules for use. Revoke batches support offerings only. Allowed values: `model`, `offering`, `evidence`, `vendor`, `inference-service`, `condition`."
      value: "model"
    validations:
      required: true
  - type: input
    id: subject_identity
    attributes:
      label: "Subject identity"
      description: "The stable ID of the record. For an update, choose an existing record. For an addition, choose a new lowercase ID; check for an existing match first. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=change#lookup-requested_outcome)."
      placeholder: "example-model-v1"
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one sentence, what do you need? For example: provide a reviewed model for document summarisation."
      placeholder: "Example: Keep a governed model record aligned with its current official lifecycle"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe what should be true when the request is complete. Use the lookup to reference models, services or exact condition versions. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=change#lookup-requested_outcome)."
      placeholder: "Example: Update the model lifecycle facts while preserving its stable identity and path."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Explain who needs this and why the current catalogue is insufficient."
      placeholder: "Example: A newer official observation shows the retained lifecycle fact is no longer current."
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "Optional. One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. Use the evidence lookup for retained observations, or enter the exact values from a new observation. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=change#lookup-requested_outcome)."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One check per line, up to 25. For example: the named model and its evidence agree."
      placeholder: |
        The record keeps the same stable identity and canonical path.
        Every changed external fact matches retained evidence and passes Modelo validation.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
