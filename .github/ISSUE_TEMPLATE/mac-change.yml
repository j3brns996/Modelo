name: "Update a catalogue record"
description: "Change facts while keeping the same stable identity."
title: "Update: "
body:
  - type: markdown
    attributes:
      value: |
        ## Update an existing record

        Use this when governed facts have changed but the logical identity remains the same. If the offering identity changes, use Move.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: dropdown
    id: request_type
    attributes:
      label: "Request type"
      description: "Fixed by this form."
      options:
        - "change"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: subject_kind
    attributes:
      label: "Subject type"
      description: "What governed record is changing?"
      options:
        - "model"
        - "offering"
        - "evidence"
        - "vendor"
        - "inference-service"
        - "condition"
    validations:
      required: true
  - type: input
    id: subject_identity
    attributes:
      label: "Subject identity"
      description: "Use the stable lowercase Modelo identity, not a display name or mutable provider alias."
      placeholder: "example-model-v1"
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one short sentence, what business or governance need does this request serve?"
      placeholder: "Example: Enable a reviewed summarisation workload"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe the catalogue state that should be true when this work is complete."
      placeholder: "Example: Add one evidenced model record. Do not approve a route."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Give the reviewer the decision context. Explain why the current catalogue state is insufficient."
      placeholder: "Example: The workload team needs a governed model record before it can request an offering."
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. These are candidate sources, not approval."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One observable completion check per line. State what a reviewer or CI can verify."
      placeholder: |
        The model name matches retained evidence.
        The proposed record passes Modelo validation.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
