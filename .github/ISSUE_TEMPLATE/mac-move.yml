name: "Move an offering"
description: "Replace one offering identity with another as one governed change."
title: "Move: "
body:
  - type: markdown
    attributes:
      value: |
        ## Replace an offering identity

        Use this when an offering identity or governed path changes meaning. Modelo treats this as destination-add plus source-withdrawal, never a cosmetic rename.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: dropdown
    id: request_type
    attributes:
      label: "Modelo MAC request type"
      description: "Fixed by this form."
      options:
        - "move"
      default: 0
    validations:
      required: true
  - type: input
    id: source_identity
    attributes:
      label: "Current offering identity"
      description: "The offering that will be withdrawn."
      placeholder: "bedrock-example-old"
    validations:
      required: true
  - type: input
    id: destination_identity
    attributes:
      label: "Replacement offering identity"
      description: "The new offering that will be added."
      placeholder: "bedrock-example-new"
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one short sentence, what business or governance need does this request serve?"
      placeholder: "Example: Replace an offering whose governed identity has changed meaning"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe the catalogue state that should be true when this work is complete."
      placeholder: "Example: Add bedrock-example-new and withdraw bedrock-example-old in the same governed change."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Give the reviewer the decision context. Explain why the current catalogue state is insufficient."
      placeholder: "Example: The route now has a different governed identity, so retaining the old identity would be misleading."
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "Optional. One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. These are candidate sources, not approval."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One observable completion check per line. State what a reviewer or CI can verify."
      placeholder: |
        The destination offering is added and the source offering is revoked atomically.
        The change delta contains no cosmetic rename or unrelated catalogue change.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
