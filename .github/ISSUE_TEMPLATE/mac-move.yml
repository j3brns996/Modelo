name: "Request: replace an offering identity"
description: "Ask to add a destination offering and withdraw its source atomically."
title: "Move offering: "
body:
  - type: markdown
    attributes:
      value: |
        ## Replace an offering identity

        Use this when an offering's stable identity or governed path must change.

        **Before you start:** A file rename is not enough. Modelo records this as one destination add and one source withdrawal so history remains honest.

        **What happens next:** the submitted JSON is validated against Modelo's change contract. A reviewed pull request and successful exact-head CI are still required before anything can be approved.
  - type: textarea
    id: mac_payload
    attributes:
      label: Change details (JSON)
      description: The operation must be `move`. Include exactly one source offering and one destination offering, plus the reason and acceptance checks for both sides.
      render: json
      placeholder: |
        { "schema_version": "0.1", "operation": "move", "replace": "with a complete schema-valid payload" }
    validations:
      required: true
  - type: input
    id: payload_digest
    attributes:
      label: Change fingerprint
      description: Paste the generated SHA-256 fingerprint for the complete canonical JSON above.
      placeholder: sha256-...
    validations:
      required: true
  - type: checkboxes
    id: assertions
    attributes:
      label: Final checks
      options:
        - label: The destination add and source withdrawal form one atomic request.
          required: true
        - label: I have not included credentials, tokens or private commercial terms.
          required: true
