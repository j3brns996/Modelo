name: "Move an offering"
description: "Replace one offering identity with another as one governed change."
title: "Move: "
body:
  - type: markdown
    attributes:
      value: |
        ## Replace an offering identity

        Use this when an offering identity or governed path changes meaning. Modelo treats this as destination-add plus source-withdrawal, never a cosmetic rename.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: input
    id: request_type
    attributes:
      label: "Modelo MAC request type"
      description: "Choose what should happen. Nothing is submitted until you review the native issue form. Allowed values: `move`."
      value: "move"
    validations:
      required: true
  - type: input
    id: source_identity
    attributes:
      label: "Current offering identity"
      description: "Choose the existing offering being replaced. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=move#lookup-requested_outcome)."
      placeholder: "bedrock-example-old"
    validations:
      required: true
  - type: input
    id: destination_identity
    attributes:
      label: "Replacement offering identity"
      description: "Choose a new offering ID. The current offering will be withdrawn in the same request. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=move#lookup-requested_outcome)."
      placeholder: "bedrock-example-new"
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one sentence, what do you need? For example: provide a reviewed model for document summarisation."
      placeholder: "Example: Replace an offering whose governed identity has changed meaning"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe what should be true when the request is complete. Use the lookup to reference models, services or exact condition versions. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=move#lookup-requested_outcome)."
      placeholder: "Example: Add bedrock-example-new and withdraw bedrock-example-old in the same governed change."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Explain who needs this and why the current catalogue is insufficient."
      placeholder: "Example: The route now has a different governed identity, so retaining the old identity would be misleading."
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "Optional. One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. Use the evidence lookup for retained observations, or enter the exact values from a new observation. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=move#lookup-requested_outcome)."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One check per line, up to 25. For example: the named model and its evidence agree."
      placeholder: |
        The destination offering is added and the source offering is revoked atomically.
        The change delta contains no cosmetic rename or unrelated catalogue change.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
