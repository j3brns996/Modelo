name: "Withdraw an offering"
description: "Remove enterprise approval from one current offering."
title: "Withdraw: "
body:
  - type: markdown
    attributes:
      value: |
        ## Withdraw an approved offering

        Use this for an explicit governance decision to end approval. A missing provider result is not enough on its own.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: dropdown
    id: request_type
    attributes:
      label: "Request type"
      description: "Fixed by this form."
      options:
        - "revoke"
      default: 0
    validations:
      required: true
  - type: input
    id: subject_identity
    attributes:
      label: "Offering identity"
      description: "Enter the stable identity of the offering whose approval should end."
      placeholder: "bedrock-example-model"
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one short sentence, what business or governance need does this request serve?"
      placeholder: "Example: End enterprise approval for a retired inference route"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe the catalogue state that should be true when this work is complete."
      placeholder: "Example: Remove the current offering so its route is no longer enterprise-approved."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Give the reviewer the decision context. Explain why the current catalogue state is insufficient."
      placeholder: "Example: Governance has ended approval after a planned service retirement; this is not inferred from a missing discovery result."
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "Optional. One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. These are candidate sources, not approval."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One observable completion check per line. State what a reviewer or CI can verify."
      placeholder: |
        The offering is absent from the current catalogue.
        The change delta records one revoke and no unrelated catalogue changes.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
