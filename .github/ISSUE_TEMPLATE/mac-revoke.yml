name: "Withdraw an offering"
description: "Remove enterprise approval from one current offering."
title: "Withdraw: "
body:
  - type: markdown
    attributes:
      value: |
        ## Withdraw an approved offering

        Use this for an explicit governance decision to end approval. A missing provider result is not enough on its own.

        **What happens next:** Modelo validates these answers and adds the canonical JSON and fingerprints to the issue. You do not need to calculate them.

  - type: dropdown
    id: request_type
    attributes:
      label: "Modelo MAC request type"
      description: "Choose what should happen. Nothing is submitted until you review the native issue form."
      options:
        - "revoke"
      default: 0
    validations:
      required: true
  - type: input
    id: subject_identity
    attributes:
      label: "Offering identity"
      description: "Choose the existing offering whose access should be withdrawn. This does not delete its history. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=revoke#lookup-requested_outcome)."
      placeholder: "bedrock-example-model"
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: "Purpose"
      description: "In one sentence, what do you need? For example: provide a reviewed model for document summarisation."
      placeholder: "Example: End enterprise approval for a retired inference route"
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: "Requested outcome"
      description: "Describe what should be true when the request is complete. Use the lookup to reference models, services or exact condition versions. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=revoke#lookup-requested_outcome)."
      placeholder: "Example: Remove the current offering so its route is no longer enterprise-approved."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is this needed?"
      description: "Explain who needs this and why the current catalogue is insufficient."
      placeholder: "Example: Governance has ended approval after a planned service retirement; this is not inferred from a missing discovery result."
    validations:
      required: true
  - type: textarea
    id: candidate_evidence
    attributes:
      label: "Supporting observations"
      description: "Optional. One observation per line: official HTTPS URL | RFC 3339 UTC time | sha256- digest. Use the evidence lookup for retained observations, or enter the exact values from a new observation. [Look up records](https://j3brns996.github.io/Modelo/propose/?operation=revoke#lookup-requested_outcome)."
      placeholder: "https://docs.example.com/model | 2026-09-02T08:00:00Z | sha256-0123…"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "One check per line, up to 25. For example: the named model and its evidence agree."
      placeholder: |
        The offering is absent from the current catalogue.
        The change delta records one revoke and no unrelated catalogue changes.
    validations:
      required: true
  - type: checkboxes
    id: final_checks
    attributes:
      label: Before submitting
      options:
        - label: "I checked the catalogue and open requests for an existing record."
          required: true
        - label: "I have not included credentials, account identifiers, tokens, private terms or provider offer tokens."
          required: true
