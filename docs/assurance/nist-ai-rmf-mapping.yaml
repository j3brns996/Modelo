    action: null
    source: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
    intent: Maintain inventory mechanisms with resources prioritised by organisational risk.
    scope: Model-release and approved provider-offering components only.
    mechanism: Git-backed records with evidence, Conditions and controlled acceptance.
    authority: Protected Git branch, trusted exact-head CI and independent authorised review.
    evidence: [Repository tests and synthetic publication demonstrate local mechanisms, No production operating assessment is available]
    timeliness: Explicit as-of date and governed evidence freshness; organisational completeness review remains external.
