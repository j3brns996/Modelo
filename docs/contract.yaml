# Modelo v0.1.0 - compact machine-readable contract
# Human rationale and examples: SPEC.md

contract:
  name: modelo
  version: "0.1.0"
  status: target
  executable_config: modelo.yaml
  human_specification: SPEC.md
  drift_is_error: true

purpose:
  system: git_backed_approval_and_publication_ledger
  live_inventory: false
  runtime_policy_engine: false
  application_api: false
  workflow_api: selected_git_provider_only
  consumer_interfaces:
    - static_pages
    - release_artefact
    - git_clone
  principle: provider_observation_is_evidence_not_approval

authority:
  paths_and_routes: modelo.yaml
  entity_shapes: schemas/
  semantic_rules: validator
  acceptance_command: modelo check
  remote_controls: platform_adapter
  rationale: SPEC.md

concepts:
  model: canonical_named_model_release
  offering: approved_operator_model_relationship
  route: provider_scoped_invocation_reference
  observation: time_bounded_first_party_evidence
  condition: versioned_enterprise_policy

identity:
  model:
    field: id
    path_template: catalogue/models/{model_id}.yaml
  offering:
    field: id
    path_template: catalogue/offerings/{operator_id}/{offering_id}.yaml
  route:
    field: id
    stored_under: offering
  provider_scope_in_canonical_path: false
  move_semantics: add_new_and_revoke_old

approval:
  applies_to: valid_catalogue_records
  requires:
    - linked_mac_issue
    - reviewed_change_request
    - required_checks
    - merge_to_protected_default_branch
  issue_is_approval: false
  provider_availability_is_approval: false
  model_alone_is_consumable: false
  offering_required_for_consumption: true
  forbidden_record_fields:
    - approval_status
    - approval_flag
    - workflow_state

evidence:
  required_for: every_non_identity_assertion
  fact_links: json_pointer
  admissible_sources:
    - first_party_read_api
    - official_provider_documentation
    - official_vendor_documentation
  required_metadata:
    - source
    - source_type
    - observed_at
    - retrieval_method
    - scope
  digest_when_safe_and_stable: true
  unsupported_fact_action: omit
  discovery_absence_can_revoke: false

pricing:
  representation: dimensional
  dimensions_are_provider_adapter_values: true
  amount:
    value_type: decimal_string
    currency: iso_4217
    unit: explicit
  private_terms_in_public_site: false

provider_boundary:
  core_treats_operator_reference_as: opaque
  syntax_owner: provider_adapter_schema
  discovery_source: first_party_read_api_or_cli
  cloud_api_access: read_only_evidence
  account_project_subscription_in_canonical_path: false
  aws:
    adapter: aws-bedrock
    first_party_operations:
      - ListFoundationModels
      - GetFoundationModel
      - GetFoundationModelAvailability
      - ListInferenceProfiles
      - ListFoundationModelAgreementOffers
    availability_scope:
      - account
      - region
    uk_region_example: eu-west-2
    sensitive_ephemeral_fields:
      - offerToken
  gcp:
    adapter: gcp-vertex-ai
    route_parts:
      - project
      - location
      - publisher
      - model
      - version
      - endpoint
  azure:
    adapter: azure-ai-foundry
    route_parts:
      - subscription
      - resource_group
      - account
      - location
      - publisher
      - model
      - version
      - deployment

platform:
  kernel_terms:
    - issue
    - change_request
    - protected_default_branch
    - required_check
    - code_owner_review
    - static_site
    - protected_release
  adapters:
    github:
      directory: .github/
      change_request: pull_request
      ci: actions
      site: pages
    gitlab:
      directory: .gitlab/
      change_request: merge_request
      ci: gitlab_ci
      site: pages
  host_switch_changes_catalogue: false
  urls_constructed_only_by_adapter: true
  workflow_writes_use_git_provider_api_only: true
  new_service_api_allowed: false
  site_routes_are_relative: true
  git_is_worm_immutable: false
  receipt_requires:
    - source_commit
    - catalogue_revision
    - manifest_digest
    - validation_result
    - issue_reference
    - change_request_reference
    - protected_tag

mac:
  initiation: issue
  operations:
    - move
    - add
    - change
    - revoke
  approval_unit: change_request
  duplicate_proposal_files: false
  batch:
    max_identities: 25
    same_source_scope: true
    same_observation_date: true
    same_operator: true
    same_semantic_operation: true

agents:
  planner: codex_work
  planner_is_system_of_record: false
  canonical_rules: AGENTS.md
  canonical_open_skills: .agents/skills/
  optional_adapters:
    - .codex/
    - .kiro/
  write_owner: root_agent
  subagents_default: read_only
  may_push: false
  may_merge: false
  may_invent_facts: false

validation:
  command: modelo check
  externally_visible_outcomes:
    - format
    - facts
    - change
    - build
  deterministic: true
  writes_must_be_parsed_and_re_read: true
  platform_controls_check: modelo platform check
  missing_executable_validator_blocks_catalogue_merge: true

technical_debt:
  implicit_debt_allowed: false
  exception_requires:
    - linked_issue
    - owner
    - rationale
    - removal_criterion
    - target_date_or_release
    - failing_or_skipped_test_reference

sustainability:
  intended_rate: 10_to_20_approved_changes_per_working_day
  review_window_days: 90
  reconsider_git_if_two_persist_for_four_weeks:
    - accepted_changes_over_50_per_day
    - repeated_bursts_over_10_per_hour_with_sub_hour_sla
    - conflict_or_manual_rebase_rate_over_10_percent
    - p95_issue_to_site_over_one_business_day_below_70_percent_reviewer_utilisation
    - p95_check_over_five_minutes_or_site_publish_over_ten_minutes
    - bypass_rate_over_5_percent
    - same_identity_normally_changes_more_than_once_per_day
    - transactional_row_level_or_live_state_required
    - clean_clone_bootstrap_over_60_seconds

deferred_until_contract_and_tests_exist:
  - live_operational_store
  - automatic_revocation_from_discovery
  - private_pricing_publication
  - cross_cloud_resource_path_normalisation
  - bespoke_authentication_service
  - bespoke_audit_service
