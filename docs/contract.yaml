# Modelo v0.1.0 - compact machine-readable contract
# Human rationale and examples: SPEC.md

contract:
  name: modelo
  version: "0.1.0"
  status: target
  executable_config: modelo.yaml
  human_specification_config_key: paths.human_specification
  machine_contract_config_key: paths.machine_contract
  drift_is_error: true

purpose:
  system: git_backed_approval_and_publication_ledger
  live_inventory: false
  runtime_policy_engine: false
  application_api: false
  workflow_api: selected_git_provider_only
  consumer_interfaces:
    - static_pages
    - release_artefact
    - git_clone
  principle: provider_observation_is_evidence_not_approval

authority:
  paths_and_routes: modelo.yaml
  entity_shapes_config_key: paths.schemas
  semantic_rules: validator
  acceptance_command: modelo check
  remote_controls: platform_adapter
  rationale: SPEC.md

concepts:
  model: canonical_named_model_release
  offering: approved_operator_model_relationship
  route: provider_scoped_invocation_reference
  observation: time_bounded_first_party_evidence
  condition: versioned_enterprise_policy
  evidence: durable_redacted_canonical_projection

identity:
  model:
    field: id
    path_config_key: paths.models
    filename_template: "{model_id}.yaml"
  offering:
    field: id
    path_config_key: paths.offerings
    filename_template: "{operator_id}/{offering_id}.yaml"
  route:
    field: id
    stored_under: offering
  evidence:
    field: id
    path_config_key: paths.evidence
    filename_template: "{evidence_id}.yaml"
    id_format: "sha256-{canonical_envelope_without_id_digest}"
    filename_matches_id: true
    ever_merged_record_is_immutable: true
  condition:
    fields:
      - id
      - version
    path_config_key: paths.conditions
    filename_template: "{condition_id}/{version}.yaml"
    version_type: positive_integer
    ever_merged_or_referenced_version_is_immutable: true
  provider_scope_in_canonical_path: false
  move_semantics: add_new_and_revoke_old

approval:
  applies_to: valid_catalogue_records
  requires:
    - linked_mac_issue
    - reviewed_change_request
    - required_checks
    - merge_to_protected_default_branch
  issue_is_approval: false
  provider_availability_is_approval: false
  model_alone_is_consumable: false
  offering_required_for_consumption: true
  offering_requires_routes_minimum: 1
  forbidden_record_fields:
    - approval_status
    - approval_flag
    - workflow_state

evidence:
  required_for: every_externally_sourced_leaf_in_model_offering_or_external_governance
  fact_links: entity_json_pointer_to_evidence_id
  ancestor_pointer_allowed_when: all_external_descendant_leaves_share_evidence
  exempt_from_external_evidence:
    - internal_ids_and_references
    - enterprise_authored_conditions
    - evidence_envelopes
  admissible_sources:
    - first_party_read_api
    - official_provider_documentation
    - official_vendor_documentation
  required_metadata:
    - source
    - observed_at
    - retrieved_by
    - scope
    - projection
    - content_sha256
    - visibility
  source_shape:
    required:
      - type
      - uri
    optional:
      - operation
    conditional:
      first_party_read_api_requires:
        - operation
  retention:
    canonical_projection: durable_git_source
    raw_response: optional_short_lived_private_artefact
  public_projection_default: excluded
  canonical_projection_digest_required: true
  content_address:
    algorithm: sha256
    input: canonical_evidence_envelope_without_id
    canonicalisation:
      data_model: json
      source: restricted_yaml_parse
      standard: RFC_8785_JCS
      encoding: utf-8
      omitted_root_fields:
        - id
  correction_or_refresh: new_evidence_id_and_mac_reference_migration
  unsupported_fact_action: omit
  discovery_absence_can_revoke: false

pricing:
  representation: dimensional
  dimensions_are_provider_adapter_values: true
  record_required:
    - dimension
    - unit
    - quantity
    - amount
    - currency
    - route_ids
  amount_type: decimal_string
  currency: iso_4217
  unit: explicit
  private_terms_in_public_site: false

provider_boundary:
  core_treats_operator_reference_as: opaque
  syntax_owner: provider_adapter_schema
  discovery_source: first_party_read_api_or_cli
  cloud_api_access: read_only_evidence
  account_project_subscription_in_canonical_path: false
  aws:
    adapter: aws-bedrock
    first_party_operations:
      - ListFoundationModels
      - GetFoundationModel
      - GetFoundationModelAvailability
      - ListInferenceProfiles
      - ListFoundationModelAgreementOffers
    availability_scope:
      - account
      - region
    uk_region_example: eu-west-2
    sensitive_ephemeral_fields:
      - offerToken
  gcp:
    adapter: gcp-vertex-ai
    status: not_implemented
    normative_route_shape: deferred_until_first_party_fixtures
    documentation_path_config_key: paths.provider_docs
    documentation_file: aws-bedrock.md
    documentation_anchor: cross-cloud-path-comparison
  azure:
    adapter: azure-ai-foundry
    status: not_implemented
    normative_route_shape: deferred_until_first_party_fixtures
    documentation_path_config_key: paths.provider_docs
    documentation_file: aws-bedrock.md
    documentation_anchor: cross-cloud-path-comparison

platform:
  kernel_terms:
    - issue
    - change_request
    - protected_default_branch
    - required_check
    - code_owner_review
    - static_site
    - protected_release
  adapters:
    github:
      directory_config_key: paths.github_adapter
      change_request: pull_request
      ci: actions
      site: pages
    gitlab:
      directory_config_key: paths.gitlab_adapter
      change_request: merge_request
      ci: gitlab_ci
      site: pages
  host_switch_changes_catalogue: false
  urls_constructed_only_by_adapter: true
  workflow_writes_use_git_provider_api_only: true
  new_service_api_allowed: false
  site_routes_are_relative: true
  git_is_worm_immutable: false
  receipt_requires:
    - source_commit
    - catalogue_revision
    - manifest_digest
    - validation_result
    - issue_reference
    - change_request_reference
    - protected_tag

mac:
  initiation: issue
  operations:
    - add
    - change
    - revoke
  intake_aliases:
    move: atomic_add_and_revoke
  approval_unit: change_request
  duplicate_proposal_files: false
  batch:
    max_identities: 25
    same_source_scope: true
    same_observation_date: true
    same_operator: true
    same_semantic_operation: true

agents:
  planner: codex_work
  planner_is_system_of_record: false
  canonical_rules_config_key: paths.agent_rules
  canonical_open_skills_config_key: paths.open_skills
  optional_adapters:
    - paths.codex_adapter
    - paths.kiro_adapter
  write_owner: root_agent
  subagents_default: read_only
  may_push: false
  may_merge: false
  may_invent_facts: false

validation:
  command: modelo check
  externally_visible_outcomes:
    - schema-and-facts
    - tests
    - build-and-site
    - release-and-clean-tree
  deterministic: true
  writes_must_be_parsed_and_re_read: true
  platform_controls_check: modelo platform check
  missing_executable_validator_blocks_catalogue_merge: true
  publication_projection:
    private_pages: may_include_redacted_internal_evidence
    public_or_synthetic:
      publish_fact_only_with_included_public_evidence: true
      otherwise_remove_fact_and_reference_together: true
    dangling_or_unsupported_fact: error

technical_debt:
  implicit_debt_allowed: false
  exception_requires:
    - linked_issue
    - owner
    - rationale
    - removal_criterion
    - target_date_or_release
    - failing_or_skipped_test_reference

sustainability:
  intended_rate: 10_to_20_approved_changes_per_working_day
  review_window_days: 90
  reconsider_git_if_two_persist_for_four_weeks:
    - metric: accepted_changes_per_working_day
      operator: greater_than
      threshold: 50
    - metric: repeated_burst_changes_per_hour
      operator: greater_than
      threshold: 10
      condition: publication_sla_under_one_hour
    - metric: conflict_or_manual_rebase_percent
      operator: greater_than
      threshold: 10
    - metric: p95_issue_to_site_business_days
      operator: greater_than
      threshold: 1
      condition: reviewer_utilisation_under_70_percent
    - metric: p95_check_minutes
      operator: greater_than
      threshold: 5
    - metric: p95_site_publish_minutes
      operator: greater_than
      threshold: 10
    - metric: workflow_bypass_percent
      operator: greater_than
      threshold: 5
    - metric: same_identity_changes_per_day
      operator: greater_than
      threshold: 1
      condition: normal_operation
    - metric: transactional_row_level_or_live_state_required
      operator: equals
      threshold: true
    - metric: clean_clone_bootstrap_seconds
      operator: greater_than
      threshold: 60

deferred_until_contract_and_tests_exist:
  - live_operational_store
  - automatic_revocation_from_discovery
  - private_pricing_publication
  - cross_cloud_resource_path_normalisation
  - bespoke_authentication_service
  - bespoke_audit_service
