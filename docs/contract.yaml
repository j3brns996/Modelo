# Modelo v0.1.0 compact target contract. Human rationale: SPEC.md.

contract:
  name: modelo
  version: "0.1.0"
  status: target_not_as_built
  implemented_slices: [T1, T2, T3, T4, T7]
  accepted_t4_head: "76b6fe8f3e74a34299851b6bae9411c719154e9d"
  unimplemented_slices: [T5, T6, T8, T9, T10]
  executable_config: modelo.yaml
  implementation_plan_config_key: paths.implementation_plan
  drift_is_error: true

purpose:
  system: git_backed_approval_and_static_publication_ledger
  application_api: false
  workflow_api: selected_git_provider_only
  live_inventory: false
  consumer_interfaces: [static_pages, release_artifact, git_clone]
  provider_observation_is_approval: false

authority:
  paths_routes_profiles_and_capabilities: modelo.yaml
  entity_shape_and_provenance_classification: schemas
  semantic_and_change_rules: modelo_validator
  technical_acceptance: trusted_modelo_check_at_exact_head
  governance_acceptance: independent_review_at_exact_head
  remote_enforcement: platform_adapter_and_host_settings
  rationale: SPEC.md

entities:
  model:
    identity: id
    path: "{paths.models}/{model_id}.yaml"
    meaning: canonical_named_model_release
  inference_service:
    identity: id
    registry: "{paths.governance}/inference-services.yaml"
    first_implemented_value: aws-bedrock
  offering:
    identity: id
    path: "{paths.offerings}/{inference_service_id}/{offering_id}.yaml"
    meaning: consumable_approval_unit
    minimum_routes: 1
  route:
    identity: id
    stored_under: offering
    core_fields: [id, adapter, reference]
    provider_reference_is_opaque_to_core: true
  evidence:
    identity: "sha256-{rfc8785_envelope_without_id}"
    path: "{paths.evidence}/{evidence_id}.yaml"
    ever_merged_record_is_immutable: true
  condition:
    identity: [id, version]
    path: "{paths.conditions}/{condition_id}/{version}.yaml"
    ever_merged_or_referenced_version_is_immutable: true

approval:
  consumption_granted_only_by_current_offering: true
  linked_mac_issue_required: true
  required_check: modelo/check
  exact_head_required: true
  missing_skipped_neutral_cancelled_stale_or_failed_is_accepting: false
  independent_review_required: true
  new_commit_invalidates_check_and_review: true
  agent_approval:
    enabled: false
    allowed_for: data_only_mac
    allowed_paths: [catalogue/models/**, catalogue/offerings/**, catalogue/evidence/**]
    every_other_path_requires_human_codeowner: true
    requires_distinct_eligible_platform_identity: true
    author_committer_or_modifier_may_approve: false
    successful_trusted_exact_head_ci_evidence_required: true
    registry_config_key: paths.actors_registry
    empty_or_missing_registry_means: disabled
    every_changed_path_must_match_allowlist: true
    any_control_plane_path_makes_entire_change_human_only: true
  human_codeowner_required_for: every_path_outside_agent_approval_allowlist

evidence:
  schema_annotation:
    provenance: x-modelo-provenance
    freshness_class: x-modelo-freshness-class
    provenance_values: [external, internal, policy]
  required_for: schema_annotated_external_leaves
  fact_reference_shape: [id, projection_pointer]
  verification: canonical_deep_equality_between_fact_and_projection
  transformed_claims: deferred
  evidence_chain_terminates_at_envelope: true
  admissible_sources:
    - first_party_read_api
    - official_provider_documentation
    - official_vendor_documentation
  required_metadata: [source, observed_at, retrieved_by, scope, projection, visibility]
  api_source_required_fields: [provider, service, operation, partition, region, sanitised_parameters, documentation_uri]
  documentation_source_required_fields: [uri]
  yaml_date_and_timestamp_scalars_remain_strings: true
  canonical_number_domain: signed_64_bit_integer_or_decimal_string
  non_finite_or_binary_float_values: forbidden
  content_address:
    canonicalisation: RFC_8785_JCS
    digest: sha256
    input: complete_envelope_without_root_id
  required_ci_dereferences_catalogue_urls: false
  discovery_absence_can_revoke: false
  refresh: new_record_and_mac_reference_migration

freshness:
  as_of_is_explicit_cli_input: true
  as_of_recorded_in_receipt: true
  classes_days:
    availability: 30
    pricing: 90
    intrinsic_model_fact: 365
  stale_fact_fails_next_check_or_scheduled_audit: true
  stale_fact_automatically_revokes_current_offering: false
  calendar_rule: stale_when_as_of_date_minus_utc_observed_date_is_greater_than_class_days
  future_observation: error
  scheduled_main_audit: modelo_check_with_base_equal_head_equal_main_and_explicit_as_of

pricing:
  optional: true
  absent_means_no_price_assertion: true
  representation: dimensional_components
  amount: decimal_string
  provider_adapter_owns_dimensions_and_units: true

provider_boundary:
  cloud_access: read_only_evidence
  core_route_reference: opaque
  account_project_subscription_in_identity_or_path: false
  aws:
    adapter: aws-bedrock
    implemented_route_types: [foundation-model, system-inference-profile]
    operations:
      - ListFoundationModels
      - GetFoundationModel
      - GetFoundationModelAvailability
      - ListInferenceProfiles
      - GetInferenceProfile
      - ListFoundationModelAgreementOffers
    admissible_catalogue_evidence_operations:
      - ListFoundationModels
      - GetFoundationModel
      - ListInferenceProfiles
      - GetInferenceProfile
      - ListFoundationModelAgreementOffers
    discovery_only_operations: [GetFoundationModelAvailability]
    observation_scope: [opaque_scope_ref, partition, region, operation, parameters, observed_at]
    sensitive_fields_never_retained: [credentials, offerToken]
    deferred_route_types: [application-profile, provisioned, custom, imported]
    model_binding:
      foundation_model:
        route_reference_equals: evidenced_model_id_or_arn
        reported_identity_equals: [canonical_model_name, governed_vendor_name]
        explicit_model_evidence_pointers: [id_pointer, arn_pointer, name_pointer, provider_pointer]
      system_inference_profile:
        requires: [explicit_profile_evidence_ref, explicit_destination_pointer_and_model_evidence_per_destination]
        destination_arn_equals_model_evidence_arn: true
        every_reported_identity_equals: [canonical_model_name, governed_vendor_name]
        validator_global_evidence_search: forbidden
      transformed_or_ambiguous_mapping: deferred
  gcp_vertex_ai: deferred_until_first_party_fixtures
  azure_ai_foundry: deferred_until_first_party_fixtures

mac:
  schema_config_key: paths.mac_schema
  initiation: git_provider_issue
  operations: [add, change, revoke, move, batch]
  change_preserves_identity: true
  move:
    subject_kind: offering_only
    action: atomic_add_destination_and_revoke_source
    subject_roles: exactly_one_source_and_one_destination
  revoke_subject_kind: offering_only
  batch_max_subjects: 25
  batch_requires_homogeneous_item_operation: [add, change, revoke]
  batch_scope_required_fields: [source, observation_scope, inference_service_id]
  issue_payload_digest_bound_to_change_and_release_receipt: true
  hash_canonicalisation: RFC_8785_JCS
  hash_input_omits: [dedupe_key, idempotency_key]
  dedupe_key: hash_of_typed_sorted_reservations_effective_operation_and_purpose
  idempotency_key: hash_of_complete_canonical_intent_also_omitting_request_id
  candidate_issue_evidence_is_accepted_catalogue_evidence: false
  revoke:
    deletes_current_record: true
    separate_status_or_tombstone_source_tree: false
    durable_history: release_delta_receipt

versioning:
  version_file_meaning: contract_and_tool_semver
  ordinary_data_change_bumps_version_file: false
  catalogue_revision: full_source_commit
  release_identity: "catalogue-YYYYMMDD.N"
  release_tag: protected_annotated_tag_at_exact_merge_sha
  signatures: optional_adapter_strengthening
  pre_one_zero_rule_or_shape_break: minor
  compatible_contract_fix: patch

diagnostics:
  fields: [code, severity, path, json_pointer, message, remediation]
  code_rename_remove_or_semantic_change_is_breaking: true
  adding_error_code_requires_contract_change: true
  exit_codes: {success: 0, validation_failure: 1, usage_or_system_error: 2}
  baseline_codes:
    - YAML_PARSE_ERROR
    - YAML_DUPLICATE_KEY
    - YAML_ALIAS_OR_ANCHOR
    - YAML_CUSTOM_TAG
    - YAML_MULTI_DOCUMENT
    - YAML_INVALID_ROOT
    - YAML_LIMIT_EXCEEDED
    - FILE_OR_PATH_ERROR
    - SCHEMA_VIOLATION
    - PATH_IDENTITY_MISMATCH
    - UNKNOWN_REFERENCE
    - EVIDENCE_MISSING
    - EVIDENCE_VALUE_MISMATCH
    - EVIDENCE_ID_MISMATCH
    - EVIDENCE_IMMUTABLE
    - EVIDENCE_STALE
    - EVIDENCE_FUTURE
    - CHANGE_INVALID
    - MAC_INVALID
    - BUILD_NONDETERMINISTIC
    - RELEASE_RECEIPT_INVALID
    - PLATFORM_CONTROL_MISSING

toolchain:
  required_runtime: python
  python_version: "3.12.13"
  uv_version: "0.11.33"
  environment_and_lock: uv
  required_ci_uses_npx: false
  clean_clone_commands:
    - uv sync --locked
    - uv run --locked modelo check --base BASE --head HEAD --as-of YYYY-MM-DD
    - uv run --locked modelo build --kind candidate --source-commit HEAD_SHA --source-tree HEAD_TREE_SHA --as-of YYYY-MM-DD --source-date-epoch AUTHOR_UNIX_SECONDS --mac-metadata VALIDATED_MAC_JSON --profile synthetic --no-base-url --base-path /Modelo/ --output dist/candidate
  solution_tooling_and_publication_are_services: false
  agent_skills_are_build_inputs: false
  network:
    core_validation_and_build: disabled
    platform_adapter: read_only_same_repository_git_provider_only
    platform_adapter_output: bounded_canonical_mac_input

build:
  catalogue_wire_schema: schemas/catalogue-output.schema.json
  manifest_wire_schema: schemas/build-manifest.schema.json
  check_receipt_wire_schema: schemas/check-receipt.schema.json
  release_receipt_wire_schema: schemas/release-receipt.schema.json
  actors_registry_schema: schemas/actors-registry.schema.json
  t5_outputs: [canonical_catalogue_bytes, canonical_change_delta_bytes, receipt_primitives]
  t5_explicit_inputs: [kind, source_commit, source_tree, as_of, source_date_epoch, validated_mac_metadata, publication_profile, base_url_choice, base_path, output]
  cli_required_flags: [kind, source_commit, source_tree, as_of, source_date_epoch, mac_metadata, profile, base_path, output]
  cli_base_url_choice: exactly_one_of_base_url_or_candidate_only_no_base_url
  cli_final_additional_flags: [merge_commit, merge_tree]
  ambient_inference: forbidden
  local_candidate_base_url_may_be_null: true
  trusted_ci_and_final_base_url: explicit_absolute_https
  default_source_epoch: exact_source_commit_author_unix_seconds
  ignored_timestamps: [committer_time, filesystem_mtime]
  source_date_epoch_override: non_negative_whole_seconds_passed_by_adapter_and_recorded_unchanged
  t5_provider_or_git_host_reads: false
  t6_consumes_single_t5_projection: true
  t6_second_raw_or_private_serialisation: forbidden
  t8_assembles_check_receipt_from_trusted_provider_metadata: true
  postmerge_assembles_release_receipt_after_exact_tree_verification: true
  output_roots:
    candidate: dist/candidate
    final: dist/final
    target_parent: dist
    detached_receipts: dist/receipts
  publication_subdir: site
  catalogue_path: data/catalogue.json
  manifest_path: data/manifest.json
  digest_algorithm: sha256_exact_bytes
  publication_digest: sha256_of_sorted_path_nul_digest_nul_size_lf_records
  manifest_files_include_manifest: false
  canonical_json: rfc8785_utf8_plus_single_lf
  canonical_sha256_scope: exact_rfc8785_bytes_including_single_lf
  catalogue_sort_keys:
    models: [id, canonical_json_bytes]
    offerings: [inference_service_id, id, canonical_json_bytes]
    evidence: [id, canonical_json_bytes]
    conditions: [id, version, canonical_json_bytes]
    routes: [id, canonical_json_bytes]
    route_destinations: [destination_pointer, canonical_json_bytes]
    pricing: [dimension, unit, quantity, amount, currency, sorted_route_ids, canonical_json_bytes]
    condition_refs: [id, version, canonical_json_bytes]
    id_arrays: ascii_id
    total_tie_breaker: canonical_json_bytes
  change_delta_sort: [operation_rank_add_change_revoke_move, primary_path, destination_path, before, after, canonical_json_bytes]
  manifest_required_fixed_files:
    - 404.html
    - assets/catalogue.js
    - assets/site.css
    - catalogue/index.html
    - changes/index.html
    - data/catalogue.json
    - docs/index.html
    - index.html
    - process/index.html
    - propose/index.html
    - schemas/actors-registry.schema.json
    - schemas/build-manifest.schema.json
    - schemas/catalogue-output.schema.json
    - schemas/check-receipt.schema.json
    - schemas/common.schema.json
    - schemas/condition.schema.json
    - schemas/evidence.schema.json
    - schemas/freshness-policy.schema.json
    - schemas/inference-services-registry.schema.json
    - schemas/mac.schema.json
    - schemas/model.schema.json
    - schemas/modelo.schema.json
    - schemas/offering.schema.json
    - schemas/providers/aws-bedrock-route.schema.json
    - schemas/release-receipt.schema.json
    - schemas/vendors-registry.schema.json
  manifest_required_derived_files: ["models/{model_id}/index.html", "offerings/{inference_service_id}/{offering_id}/index.html"]
  manifest_completeness: files_keys_equal_fixed_union_projection_derived_excluding_manifest
  manifest_completeness_executable_owner: t6
  semantic_evidence_projection_arrays_preserve_source_order: true
  writer_lock: exclusive_create_or_fail_fast
  staging: dist/{candidate_or_final}.{128_bit_csprng_hex}.staging
  backup: dist/{candidate_or_final}.{128_bit_csprng_hex}.backup
  promotion: [lock, stage, fsync_stage, validate_stage, backup_old, promote_new, fsync_parent, verify_target, remove_backup, unlock]
  atomicity_scope: each_same_filesystem_rename_not_whole_multi_rename_transaction
  observable_target: complete_old_complete_new_or_temporarily_absent_never_partial
  final_durability: fsync_files_and_directories_or_incapable
  recovery: explicit_bounded_journal_restore_or_fail_closed_on_ambiguity
  failure: restore_backup_remove_new_staging_preserve_previous_complete_output

canonical_site_url:
  scheme: https
  host: lowercase_dns
  port: implicit_443_only
  forbidden: [userinfo, query, fragment, dot_segments, percent_encoding]
  trailing_slash: required
  path_must_equal_normalised_base_path: true
  examples: ["https://host.invalid/ + /", "https://host.invalid/Modelo/ + /Modelo/"]

site:
  contract_config_key: paths.site_contract
  routes_config_key: site.routes
  templates_config_key: paths.site_templates
  generated_output_config_key: build.final_root
  generator_uses_network: false
  urls_come_from_global_config_only: true
  profiles: [synthetic, private]
  production_public_field_redaction: deferred
  private_to_public_fallback: forbidden
  change_history_source: local_git_first_parent_deltas
  release_receipt_is_site_build_input: false
  final_postmerge_artifact_is_validated_then_deployed_without_rebuild: true
  test_ownership:
    t6: [no_javascript_navigation, link_integrity, inert_xss, publication_non_leakage, accessibility_structure]
    t8: pinned_python_controlled_browser_outside_core_build
    t10: human_keyboard_and_screen_reader_evidence

validation:
  command: modelo check --base BASE --head HEAD --as-of YYYY-MM-DD
  restricted_yaml: true
  change_aware: true
  deterministic: true
  checks:
    - configuration_and_paths
    - yaml_schema_and_stable_diagnostics
    - references_evidence_equality_and_freshness
    - immutability_move_and_revoke_against_base
    - tests_and_adapter_parity
    - deterministic_catalogue_site_and_receipts
    - clean_tree_and_supply_chain_pins
  release_receipt_fields:
    - contract_version
    - base_source_and_merge_shas
    - as_of
    - catalogue_publication_and_manifest_digests
    - tool_and_lock_digest
    - exact_ci_run_check_and_result
    - issue_and_change_request_refs
    - change_delta
    - head_and_merge_tree_shas
    - source_date_epoch
    - reviewer_platform_identity
    - approved_head_sha
    - approval_timestamp
    - actors_registry_digest
    - independence_and_eligibility_result
    - provider_approval_and_check_reference
  premerge_artifact:
    records_head_tree_sha: true
    protected_branch_must_be_up_to_date: true
    merge_gate_requires_current_base_equal_receipt_base: true
    purpose: candidate_content_validation_not_release
  t8_check_receipt_correlations:
    - repository_identity
    - base_head_and_head_tree
    - as_of_source_epoch_profile_base_url_and_base_path
    - mac_payload_and_canonical_change_delta
    - named_artifact_paths_and_digests
    - tool_and_lock_digests
    - actors_registry_digest_and_actor_eligibility
    - trusted_ci_provider_workflow_run_check_result_and_exact_head
  t8_trusted_input_equality: [repository, current_base_sha, current_head_sha, current_head_tree_sha, as_of, source_date_epoch, profile, base_url, base_path, mac_issue, mac_payload_digest, canonical_change_delta, named_artifacts_and_digests, tool_digest, lock_digest, actors_registry_digest, ci_provider, workflow_identity, run_id, check_name, success_result]
  t8_internal_receipt_equalities: [ci_head_equals_top_level_head, ci_provider_equals_repository_provider]
  accepted_check_receipt_digest: sha256_of_complete_rfc8785_utf8_plus_single_lf
  postmerge_publication:
    merge_tree_must_equal_accepted_head_tree: true
    builds_final_merge_aware_artifact_once: true
    validates_and_deploys_that_exact_artifact_without_rebuild: true
    detached_receipt_hashes_final_artifact: true
    receipt_is_not_inside_hashed_artifact: true
    required_equalities: [release_source_equals_check_head, release_ci_head_equals_check_head, approval_head_equals_check_head, base_equals_check_base, head_tree_equals_check_head_tree, merge_tree_equals_head_tree]
    continuity: [repository, as_of, source_date_epoch, profile, base_url, base_path, mac_delta, catalogue_artifact, tool_digest, lock_digest, workflow_identity]
    final_only_digest_exceptions: [publication, manifest]

platform:
  neutral_terms: [issue, change_request, required_check, protected_default_branch, static_site, release]
  github_adapter_config_key: paths.github_adapter
  gitlab_adapter_config_key: paths.gitlab_adapter
  gitlab_ci_config_key: paths.gitlab_ci
  host_switch_changes_core_records: false
  platform_check: modelo platform check
  missing_required_capability: fail_closed
  private_pages_missing: restricted_artifact_not_public_pages
  merge_queue_or_train: deferred_until_candidate_tree_contract
  actors_registry_config_key: paths.actors_registry
  unconfigured_agent_identity_mode: human_only
  github_trusted_pipeline: required_workflow_from_protected_default_branch
  gitlab_trusted_pipeline: pipeline_execution_policy_or_equivalent
  missing_trusted_pipeline_result: incapable

recovery:
  git_mirror_alone_is_complete_operational_backup: false
  bundle_requires: [git_mirror, host_metadata_export, control_manifest, releases_and_receipts, locked_dependency_archive]
  restore_rehearsal_required: true

agents:
  canonical_rules_config_key: paths.agent_rules
  canonical_open_skills_config_key: paths.open_skills
  skills_purpose: authorship_and_review_guidance
  ci_executes_skill_prose: false
  skills_used_before_locked_cli_not_by_build: true
  build_identical_without_skills: true
  shared_cli_ownership_slices: [T5, T6, T8]
  one_writer_per_branch_or_worktree: true
  review_agents_read_only: true

technical_debt:
  implicit_allowed: false
  exception_requires: [linked_issue, owner, rationale, removal_criterion, target_date_or_release, failing_or_skipped_test]

deferred:
  - modelo_application_api_or_live_store
  - automatic_revocation_from_discovery
  - transformed_evidence_claims
  - production_public_field_redaction
  - private_or_negotiated_pricing
  - account_owned_provider_routes
  - gcp_and_azure_adapters
  - live_telemetry_and_runtime_health
