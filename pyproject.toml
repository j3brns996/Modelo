[project]
name = "modelo-tooling"
version = "0.2.0"
description = "Validation and static-publication tooling for Modelo"
requires-python = "==3.12.13"
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "ast-grep-cli==0.40.1",
  "pytest==8.4.2",
  "ripgrep==15.1.0 ; sys_platform == 'linux'",
  "ruff==0.16.6",
  "yamllint==1.38.0",
]

[project.scripts]
modelo = "modelo.cli:main"
modelo-local-ci = "modelo.local_ci:main"

[build-system]
requires = ["uv_build==0.11.33"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.33"

[tool.uv.build-backend]
module-name = "modelo"
module-root = "tooling/modelo/src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["tests/fixtures/semantic"]
