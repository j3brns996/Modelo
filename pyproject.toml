[project]
name = "modelo-tooling"
version = "0.1.2"
description = "Validation and static-publication tooling for Modelo"
requires-python = "==3.12.13"
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[project.scripts]
modelo = "modelo.cli:main"
modelo-local-ci = "modelo.local_ci:main"

[build-system]
requires = ["uv_build==0.11.33"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.33"

[tool.uv.build-backend]
module-name = "modelo"
module-root = "tooling/modelo/src"
